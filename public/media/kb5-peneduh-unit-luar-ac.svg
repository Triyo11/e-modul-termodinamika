<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Literata, Georgia, 'Times New Roman', serif">
  <title id="t">Unit luar AC dengan peneduh, tampak samping</title>
  <desc id="d">Unit luar AC berdiri di dekat dinding gedung. Peneduh di atasnya menghalangi sinar matahari langsung. Udara masuk dari belakang unit dan udara panas diembuskan ke depan. Jarak bebas A di belakang, B di atas, dan C di depan unit tidak boleh terhalang; nilainya dilihat di buku manual AC.</desc>
  <defs>
    <marker id="pBiru" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C70A1"/></marker>
    <marker id="pMerah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker>
    <marker id="pGelap" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2019"/></marker>
    <marker id="pKuning" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07A00"/></marker>
  </defs>
  <rect width="800" height="600" fill="#EDF6F9"/>
  <rect x="0" y="500" width="800" height="100" fill="#C5D7DE"/>
  <polygon points="130,500 520,500 480,522 130,522" fill="#86979B" opacity="0.5"/>
  <!-- dinding -->
  <rect x="20" y="40" width="110" height="460" fill="#A8BAC1" stroke="#1E2019" stroke-width="3"/>
  <text x="75" y="290" font-size="26" fill="#1E2019" text-anchor="middle" transform="rotate(-90 75 290)">dinding gedung</text>
  <!-- matahari -->
  <circle cx="720" cy="72" r="44" fill="#F2B705"/>
  <line x1="672" y1="112" x2="560" y2="200" stroke="#B07A00" stroke-width="5" marker-end="url(#pKuning)"/>
  <line x1="690" y1="134" x2="610" y2="210" stroke="#B07A00" stroke-width="5" marker-end="url(#pKuning)"/>
  <!-- peneduh -->
  <polygon points="130,226 560,256 560,270 130,240" fill="#2F352F"/>
  <line x1="540" y1="266" x2="540" y2="500" stroke="#2F352F" stroke-width="7"/>
  <text x="300" y="210" font-size="32" fill="#1E2019" text-anchor="middle" font-weight="700">peneduh</text>
  <!-- unit luar -->
  <rect x="200" y="340" width="220" height="160" rx="10" fill="#FFFFFF" stroke="#1E2019" stroke-width="4"/>
  <circle cx="345" cy="420" r="52" fill="none" stroke="#1E2019" stroke-width="3"/>
  <circle cx="345" cy="420" r="8" fill="#1E2019"/>
  <text x="250" y="402" font-size="26" fill="#1E2019" text-anchor="middle">unit</text>
  <text x="250" y="432" font-size="26" fill="#1E2019" text-anchor="middle">luar</text>
  <!-- udara masuk dan keluar -->
  <line x1="140" y1="470" x2="192" y2="470" stroke="#0C70A1" stroke-width="7" marker-end="url(#pBiru)"/>
  <line x1="430" y1="395" x2="650" y2="395" stroke="#B3261E" stroke-width="8" marker-end="url(#pMerah)"/>
  <line x1="430" y1="445" x2="650" y2="445" stroke="#B3261E" stroke-width="8" marker-end="url(#pMerah)"/>
  <text x="790" y="372" font-size="26" fill="#B3261E" text-anchor="end" font-weight="700">udara panas keluar</text>
  <!-- jarak bebas -->
  <line x1="130" y1="320" x2="200" y2="320" stroke="#1E2019" stroke-width="3" marker-start="url(#pGelap)" marker-end="url(#pGelap)"/>
  <text x="165" y="308" font-size="28" fill="#1E2019" text-anchor="middle" font-weight="700">A</text>
  <line x1="300" y1="252" x2="300" y2="334" stroke="#1E2019" stroke-width="3" marker-start="url(#pGelap)" marker-end="url(#pGelap)"/>
  <text x="316" y="304" font-size="28" fill="#1E2019" font-weight="700">B</text>
  <line x1="420" y1="540" x2="660" y2="540" stroke="#1E2019" stroke-width="3" marker-start="url(#pGelap)" marker-end="url(#pGelap)"/>
  <text x="540" y="580" font-size="28" fill="#1E2019" text-anchor="middle" font-weight="700">C</text>
  <!-- keterangan -->
  <text x="200" y="58" font-size="24" fill="#1E2019">A, B, C: jarak bebas</text>
  <text x="200" y="90" font-size="24" fill="#1E2019">(lihat buku manual AC)</text>
  <text x="200" y="130" font-size="24" fill="#B3261E" font-weight="700">Sisi depan jangan ditutup</text>
</svg>
