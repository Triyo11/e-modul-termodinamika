<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Literata, Georgia, 'Times New Roman', serif">
  <title id="t">Kotak kedap udara berisi kamera tertinggal di dalam mobil yang diparkir di bawah terik matahari</title>
  <desc id="d">Kabin mobil dilihat dari dalam. Matahari bersinar terik di luar kaca depan. Di atas jok tergeletak kotak kedap udara transparan berisi kamera. Tutupnya terkunci rapat dan tampak sedikit menggembung; panah kecil di dalam kotak menunjukkan udara mendorong dinding dan tutup ke luar. Termometer di samping kotak menunjukkan suhu tinggi.</desc>

  <!-- latar kabin -->
  <rect width="800" height="600" fill="#EDF6F9"/>

  <g transform="translate(0,-40)">
  <!-- kaca depan dan langit -->
  <path d="M70,40 L730,40 L680,250 L120,250 Z" fill="#CFE6F2" stroke="#1E2019" stroke-width="5" stroke-linejoin="round"/>
  <!-- matahari -->
  <g stroke="#E0A100" stroke-width="6" stroke-linecap="round">
    <line x1="560" y1="70" x2="560" y2="46"/>
    <line x1="560" y1="174" x2="560" y2="198"/>
    <line x1="508" y1="122" x2="484" y2="122"/>
    <line x1="612" y1="122" x2="636" y2="122"/>
    <line x1="523" y1="85" x2="506" y2="68"/>
    <line x1="597" y1="85" x2="614" y2="68"/>
    <line x1="523" y1="159" x2="506" y2="176"/>
    <line x1="597" y1="159" x2="614" y2="176"/>
  </g>
  <circle cx="560" cy="122" r="38" fill="#FFD34D" stroke="#1E2019" stroke-width="4"/>
  <!-- sinar menembus kaca -->
  <g stroke="#E0A100" stroke-width="4" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.8">
    <line x1="520" y1="170" x2="430" y2="335"/>
    <line x1="560" y1="175" x2="505" y2="335"/>
  </g>

  <!-- dasbor -->
  <path d="M40,250 L760,250 L760,300 Q400,330 40,300 Z" fill="#A8BAC1" stroke="#1E2019" stroke-width="5" stroke-linejoin="round"/>

  </g>

  <!-- jok -->
  <rect x="150" y="380" width="500" height="190" rx="36" fill="#7E9099" stroke="#1E2019" stroke-width="5"/>
  <line x1="170" y1="470" x2="630" y2="470" stroke="#5E6F77" stroke-width="4"/>

  <g transform="translate(0,22)">
  <!-- kotak kedap udara -->
  <g>
    <!-- badan kotak -->
    <rect x="270" y="338" width="260" height="150" rx="10" fill="#FFFFFF" fill-opacity="0.75" stroke="#1E2019" stroke-width="5"/>
    <!-- kamera di dalam -->
    <rect x="330" y="388" width="120" height="74" rx="10" fill="#1E2019"/>
    <rect x="352" y="376" width="36" height="16" rx="4" fill="#1E2019"/>
    <circle cx="390" cy="425" r="24" fill="#5E6F77" stroke="#EDF6F9" stroke-width="4"/>
    <circle cx="390" cy="425" r="10" fill="#0C70A1"/>
    <!-- kantong silika gel -->
    <rect x="465" y="440" width="40" height="34" rx="4" fill="#EDF6F9" stroke="#1E2019" stroke-width="3"/>
    <text x="485" y="462" font-size="11" text-anchor="middle" fill="#1E2019">silika</text>
    <!-- segel karet -->
    <line x1="268" y1="338" x2="532" y2="338" stroke="#B3261E" stroke-width="5"/>
    <!-- tutup menggembung -->
    <path d="M262,338 Q400,300 538,338 L538,326 Q400,286 262,326 Z" fill="#0C70A1" stroke="#1E2019" stroke-width="5" stroke-linejoin="round"/>
    <!-- pengunci -->
    <rect x="252" y="322" width="18" height="34" rx="4" fill="#5E6F77" stroke="#1E2019" stroke-width="3"/>
    <rect x="530" y="322" width="18" height="34" rx="4" fill="#5E6F77" stroke="#1E2019" stroke-width="3"/>
    <!-- panah tekanan dari dalam -->
    <g fill="#B3261E">
      <path d="M300,372 l0,-22 l-8,0 l12,-14 l12,14 l-8,0 l0,22 z"/>
      <path d="M494,372 l0,-22 l-8,0 l12,-14 l12,14 l-8,0 l0,22 z"/>
      <path d="M296,420 l-14,0 l0,-8 l-14,12 l14,12 l0,-8 l14,0 z"/>
      <path d="M504,420 l14,0 l0,-8 l14,12 l-14,12 l0,-8 l-14,0 z"/>
    </g>
  </g>

  <!-- termometer -->
  <g>
    <rect x="610" y="300" width="28" height="150" rx="14" fill="#FFFFFF" stroke="#1E2019" stroke-width="4"/>
    <rect x="618" y="318" width="12" height="124" rx="6" fill="#B3261E"/>
    <circle cx="624" cy="462" r="22" fill="#B3261E" stroke="#1E2019" stroke-width="4"/>
    <g stroke="#1E2019" stroke-width="3">
      <line x1="638" y1="330" x2="650" y2="330"/>
      <line x1="638" y1="360" x2="650" y2="360"/>
      <line x1="638" y1="390" x2="650" y2="390"/>
      <line x1="638" y1="420" x2="650" y2="420"/>
    </g>
  </g>
  </g>
</svg>
