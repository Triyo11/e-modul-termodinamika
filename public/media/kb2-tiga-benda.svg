<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Literata, Georgia, 'Times New Roman', serif">
  <title id="t">Panci terbuka, silinder berpiston, dan termos</title>
  <desc id="d">Tiga benda berjajar. Kiri: panci berisi air mendidih tanpa tutup di atas kompor, uap naik dari permukaan air. Tengah: silinder kaca berisi gas yang ditutup piston. Kanan: termos tertutup rapat.</desc>
  <rect width="960" height="540" fill="#EDF6F9"/>
  <rect x="0" y="430" width="960" height="110" fill="#DAE8EF"/>
  <line x1="320" y1="40" x2="320" y2="500" stroke="#C5D7DE" stroke-width="2"/>
  <line x1="640" y1="40" x2="640" y2="500" stroke="#C5D7DE" stroke-width="2"/>

  <!-- PANCI TERBUKA -->
  <g>
    <!-- uap -->
    <path d="M120,200 c-18,-26 18,-40 0,-66 c-14,-20 10,-34 4,-52" fill="none" stroke="#86979B" stroke-width="6" stroke-linecap="round"/>
    <path d="M165,196 c-18,-26 18,-40 0,-66 c-14,-20 10,-34 4,-52" fill="none" stroke="#86979B" stroke-width="6" stroke-linecap="round"/>
    <path d="M210,200 c-18,-26 18,-40 0,-66 c-14,-20 10,-34 4,-52" fill="none" stroke="#86979B" stroke-width="6" stroke-linecap="round"/>
    <!-- panci -->
    <path d="M70,220 L260,220 L248,358 Q246,372 232,372 L98,372 Q84,372 82,358 Z" fill="#5A6668" stroke="#1E2019" stroke-width="4"/>
    <rect x="40" y="226" width="34" height="12" rx="6" fill="#1E2019"/>
    <rect x="256" y="226" width="34" height="12" rx="6" fill="#1E2019"/>
    <!-- air -->
    <path d="M76,236 L254,236 L250,282 L80,282 Z" fill="#00A6FB" opacity="0.55"/>
    <circle cx="120" cy="252" r="7" fill="#FFFFFF" opacity="0.8"/><circle cx="170" cy="262" r="5" fill="#FFFFFF" opacity="0.8"/><circle cx="215" cy="250" r="6" fill="#FFFFFF" opacity="0.8"/>
    <!-- kompor -->
    <rect x="60" y="388" width="210" height="42" rx="6" fill="#323733"/>
    <path d="M110,388 q8,-16 0,-26 q14,8 12,26 z M160,388 q8,-18 0,-30 q16,10 13,30 z M210,388 q8,-16 0,-26 q14,8 12,26 z" fill="#F2B705"/>
    <text x="160" y="490" font-size="30" fill="#1E2019" text-anchor="middle" font-weight="700">panci terbuka</text>
  </g>

  <!-- SILINDER BERPISTON -->
  <g>
    <!-- batang piston -->
    <rect x="471" y="70" width="18" height="120" fill="#5A6668" stroke="#1E2019" stroke-width="3"/>
    <rect x="440" y="60" width="80" height="18" rx="6" fill="#1E2019"/>
    <!-- silinder kaca -->
    <rect x="400" y="150" width="160" height="270" rx="8" fill="#FFFFFF" fill-opacity="0.55" stroke="#1E2019" stroke-width="4"/>
    <!-- piston -->
    <rect x="404" y="186" width="152" height="26" fill="#323733"/>
    <!-- gas -->
    <rect x="404" y="212" width="152" height="204" fill="#D9F0FA"/>
    <g fill="#0C70A1">
      <circle cx="430" cy="250" r="7"/><circle cx="490" cy="235" r="7"/><circle cx="530" cy="270" r="7"/>
      <circle cx="455" cy="300" r="7"/><circle cx="515" cy="320" r="7"/><circle cx="430" cy="360" r="7"/>
      <circle cx="490" cy="380" r="7"/><circle cx="535" cy="390" r="7"/><circle cx="470" cy="345" r="7"/>
    </g>
    <rect x="390" y="416" width="180" height="14" rx="4" fill="#1E2019"/>
    <text x="480" y="490" font-size="30" fill="#1E2019" text-anchor="middle" font-weight="700">silinder berpiston</text>
  </g>

  <!-- TERMOS -->
  <g>
    <rect x="762" y="92" width="76" height="40" rx="8" fill="#1E2019"/>
    <rect x="752" y="128" width="96" height="16" rx="4" fill="#323733"/>
    <path d="M740,144 L860,144 L860,404 Q860,430 834,430 L766,430 Q740,430 740,404 Z" fill="#0C70A1" stroke="#1E2019" stroke-width="4"/>
    <rect x="752" y="170" width="16" height="220" rx="8" fill="#FFFFFF" opacity="0.35"/>
    <rect x="740" y="250" width="120" height="16" fill="#1E2019" opacity="0.35"/>
    <text x="800" y="490" font-size="30" fill="#1E2019" text-anchor="middle" font-weight="700">termos</text>
  </g>
</svg>
