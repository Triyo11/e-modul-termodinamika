<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Literata, Georgia, 'Times New Roman', serif">
  <title id="t">Termometer badan, lemari es, dan botol parfum terbuka</title>
  <desc id="d">Tiga peristiwa sehari-hari. Kiri: termometer badan dijepit di ketiak. Tengah: lemari es tersambung ke stopkontak. Kanan: botol parfum terbuka di sudut ruangan dan aromanya menyebar.</desc>
  <rect width="960" height="540" fill="#EDF6F9"/>
  <rect x="0" y="430" width="960" height="110" fill="#DAE8EF"/>
  <line x1="320" y1="40" x2="320" y2="500" stroke="#C5D7DE" stroke-width="2"/>
  <line x1="640" y1="40" x2="640" y2="500" stroke="#C5D7DE" stroke-width="2"/>

  <!-- TERMOMETER DI KETIAK (sosok sederhana) -->
  <g>
    <circle cx="160" cy="105" r="42" fill="#A8BAC1" stroke="#1E2019" stroke-width="4"/>
    <path d="M90,170 Q160,145 230,170 L238,410 L82,410 Z" fill="#A8BAC1" stroke="#1E2019" stroke-width="4"/>
    <!-- termometer: ujungnya terjepit di ketiak, tertutup lengan -->
    <g transform="rotate(24 116 236)">
      <rect x="6" y="228" width="124" height="16" rx="8" fill="#FFFFFF" stroke="#1E2019" stroke-width="3"/>
      <rect x="20" y="232" width="80" height="8" rx="4" fill="#B3261E"/>
      <rect x="100" y="228" width="30" height="16" rx="8" fill="#0C70A1"/>
    </g>
    <!-- lengan menjepit -->
    <path d="M100,186 Q74,260 96,360" fill="none" stroke="#1E2019" stroke-width="32" stroke-linecap="round"/>
    <path d="M100,186 Q74,260 96,360" fill="none" stroke="#A8BAC1" stroke-width="24" stroke-linecap="round"/>
    <text x="160" y="490" font-size="30" fill="#1E2019" text-anchor="middle" font-weight="700">termometer badan</text>
  </g>

  <!-- LEMARI ES -->
  <g>
    <rect x="410" y="80" width="150" height="330" rx="12" fill="#FFFFFF" stroke="#1E2019" stroke-width="4"/>
    <line x1="410" y1="190" x2="560" y2="190" stroke="#1E2019" stroke-width="4"/>
    <rect x="530" y="110" width="10" height="50" rx="5" fill="#5A6668"/>
    <rect x="530" y="220" width="10" height="80" rx="5" fill="#5A6668"/>
    <!-- kabel dan stopkontak -->
    <path d="M560,390 C600,392 590,330 606,320" fill="none" stroke="#1E2019" stroke-width="5"/>
    <rect x="596" y="290" width="34" height="44" rx="6" fill="#FFFFFF" stroke="#1E2019" stroke-width="3"/>
    <circle cx="607" cy="312" r="4" fill="#1E2019"/><circle cx="620" cy="312" r="4" fill="#1E2019"/>
    <rect x="404" y="410" width="162" height="18" rx="4" fill="#323733"/>
    <text x="480" y="490" font-size="30" fill="#1E2019" text-anchor="middle" font-weight="700">lemari es</text>
  </g>

  <!-- PARFUM DI SUDUT RUANGAN -->
  <g>
    <!-- sudut ruangan -->
    <polyline points="900,60 900,430 680,430" fill="none" stroke="#86979B" stroke-width="4"/>
    <!-- botol -->
    <rect x="828" y="318" width="54" height="80" rx="10" fill="#00A6FB" fill-opacity="0.6" stroke="#1E2019" stroke-width="4"/>
    <rect x="845" y="298" width="20" height="22" fill="#5A6668" stroke="#1E2019" stroke-width="3"/>
    <rect x="800" y="408" width="30" height="16" rx="4" fill="#1E2019"/>
    <!-- aroma menyebar -->
    <g fill="#0C70A1" opacity="0.75">
      <circle cx="850" cy="270" r="6"/><circle cx="820" cy="240" r="6"/><circle cx="860" cy="215" r="6"/>
      <circle cx="790" cy="200" r="6"/><circle cx="835" cy="170" r="6"/><circle cx="760" cy="160" r="6"/>
      <circle cx="805" cy="125" r="6"/><circle cx="720" cy="130" r="6"/><circle cx="760" cy="95" r="6"/>
      <circle cx="700" cy="210" r="6"/><circle cx="740" cy="260" r="6"/>
    </g>
    <text x="790" y="490" font-size="30" fill="#1E2019" text-anchor="middle" font-weight="700">parfum terbuka</text>
  </g>
</svg>
