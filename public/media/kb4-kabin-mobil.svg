<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Literata, Georgia, 'Times New Roman', serif">
  <title id="t">Mobil yang diparkir di bawah terik matahari</title>
  <desc id="d">Mobil diparkir di halaman tanpa peneduh. Sinar matahari masuk melalui kaca dan diserap dasbor serta jok. Di dalam kabin ada ponsel dan power bank di atas dasbor. Udara panas terkurung di dalam kabin. Termometer di luar menunjukkan 32 derajat Celsius, sedangkan di dalam kabin ditandai tanda tanya.</desc>
  <defs>
    <marker id="pKuning" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0A800"/></marker>
  </defs>
  <rect width="800" height="600" fill="#EDF6F9"/>
  <circle cx="90" cy="80" r="44" fill="#F5C443"/>
  <g stroke="#E0A800" stroke-width="6" stroke-linecap="round" marker-end="url(#pKuning)">
    <line x1="140" y1="120" x2="270" y2="290"/><line x1="160" y1="95" x2="440" y2="300"/>
  </g>
  <rect x="0" y="470" width="800" height="130" fill="#C9D3D6"/>
  <!-- badan mobil -->
  <path d="M120 400 L170 300 Q190 250 260 240 L520 240 Q580 245 620 300 L690 330 Q720 340 720 380 L720 420 L120 420 Z" fill="#8A4B2A" stroke="#1E2019" stroke-width="5"/>
  <!-- kaca -->
  <path d="M200 300 Q215 262 265 258 L370 258 L370 320 L195 320 Z" fill="#BFE3F2" stroke="#1E2019" stroke-width="3"/>
  <path d="M390 258 L515 258 Q565 262 595 320 L390 320 Z" fill="#BFE3F2" stroke="#1E2019" stroke-width="3"/>
  <!-- isi kabin -->
  <rect x="300" y="300" width="34" height="18" rx="3" fill="#1E2019"/>
  <rect x="340" y="304" width="26" height="14" rx="3" fill="#5A6668"/>
  <text x="285" y="350" font-size="18" fill="#FFFFFF">ponsel, power bank</text>
  <text x="470" y="295" font-size="30" fill="#B3261E" text-anchor="middle" font-weight="700">? °C</text>
  <!-- roda -->
  <circle cx="230" cy="425" r="45" fill="#1E2019"/><circle cx="230" cy="425" r="18" fill="#86979B"/>
  <circle cx="610" cy="425" r="45" fill="#1E2019"/><circle cx="610" cy="425" r="18" fill="#86979B"/>
  <!-- termometer luar -->
  <rect x="660" y="110" width="110" height="80" rx="10" fill="#FFFFFF" stroke="#1E2019" stroke-width="3"/>
  <text x="715" y="140" font-size="18" fill="#1E2019" text-anchor="middle">udara luar</text>
  <text x="715" y="174" font-size="28" fill="#0C70A1" text-anchor="middle" font-weight="700">32 °C</text>
  <text x="400" y="540" font-size="24" fill="#1E2019" text-anchor="middle" font-weight="700">Mobil diparkir tanpa peneduh pada siang hari</text>
</svg>
