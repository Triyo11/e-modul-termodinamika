<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Literata, Georgia, 'Times New Roman', serif">
  <title id="t">Pengisian tabung udara napas dengan kompresor</title>
  <desc id="d">Kompresor dihubungkan dengan selang ke tabung udara napas. Pengukur tekanan pada selang menunjukkan tabung sudah penuh. Termometer yang ditempel pada dinding tabung menunjukkan suhu tinggi. Di sebelahnya, tabung yang sama setelah dingin menunjukkan tekanan yang lebih rendah.</desc>
  <rect width="800" height="600" fill="#EDF6F9"/>
  <rect x="0" y="500" width="800" height="100" fill="#C9D3D6"/>
  <!-- kompresor -->
  <rect x="40" y="330" width="190" height="170" rx="12" fill="#5A6668" stroke="#1E2019" stroke-width="4"/>
  <circle cx="135" cy="415" r="45" fill="#86979B" stroke="#1E2019" stroke-width="3"/>
  <text x="135" y="315" font-size="24" fill="#1E2019" text-anchor="middle" font-weight="700">kompresor</text>
  <!-- selang -->
  <path d="M230 380 C300 380 300 250 380 250 L420 250" fill="none" stroke="#1E2019" stroke-width="8"/>
  <circle cx="330" cy="215" r="34" fill="#FFFFFF" stroke="#1E2019" stroke-width="3"/>
  <line x1="330" y1="215" x2="352" y2="196" stroke="#B3261E" stroke-width="4"/>
  <text x="330" y="168" font-size="20" fill="#1E2019" text-anchor="middle">pengukur tekanan</text>
  <!-- tabung panas -->
  <rect x="420" y="190" width="110" height="310" rx="50" fill="#F3B8A0" stroke="#1E2019" stroke-width="4"/>
  <rect x="455" y="160" width="40" height="34" rx="6" fill="#1E2019"/>
  <text x="475" y="540" font-size="22" fill="#1E2019" text-anchor="middle" font-weight="700">diisi cepat</text>
  <rect x="440" y="300" width="70" height="90" rx="8" fill="#FFFFFF" stroke="#1E2019" stroke-width="2"/>
  <text x="475" y="335" font-size="16" fill="#1E2019" text-anchor="middle">suhu</text>
  <text x="475" y="370" font-size="24" fill="#B3261E" text-anchor="middle" font-weight="700">panas</text>
  <!-- tabung dingin -->
  <rect x="620" y="190" width="110" height="310" rx="50" fill="#D9F0FA" stroke="#1E2019" stroke-width="4"/>
  <rect x="655" y="160" width="40" height="34" rx="6" fill="#1E2019"/>
  <text x="675" y="540" font-size="22" fill="#1E2019" text-anchor="middle" font-weight="700">setelah dingin</text>
  <circle cx="675" cy="120" r="30" fill="#FFFFFF" stroke="#1E2019" stroke-width="3"/>
  <line x1="675" y1="120" x2="690" y2="100" stroke="#B3261E" stroke-width="4"/>
  <line x1="675" y1="150" x2="675" y2="160" stroke="#1E2019" stroke-width="4"/>
  <text x="675" y="74" font-size="18" fill="#1E2019" text-anchor="middle">tekanan lebih rendah</text>
  <line x1="545" y1="345" x2="605" y2="345" stroke="#0C70A1" stroke-width="5"/>
  <path d="M605 335 L620 345 L605 355 Z" fill="#0C70A1"/>
</svg>
