<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Literata, Georgia, 'Times New Roman', serif">
  <title id="t">Penampang katup pemberat pada tutup kotak</title>
  <desc id="d">Lubang kecil berdiameter d di tutup kotak ditutup cakram berbeban. Udara di dalam kotak mendorong cakram ke atas dengan gaya p_dalam kali A. Berat beban mg dan tekanan udara luar p_luar kali A menekannya ke bawah. Katup mulai terangkat ketika selisih tekanan kali A sama dengan mg.</desc>
  <defs>
    <marker id="pBiru" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0C70A1"/></marker>
    <marker id="pGelap" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2019"/></marker>
    <pattern id="arsir" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#86979B" stroke-width="3"/></pattern>
  </defs>
  <rect width="800" height="600" fill="#EDF6F9"/>
  <rect x="0" y="330" width="800" height="270" fill="#D9F0FA"/>
  <text x="28" y="52" font-size="32" fill="#1E2019" font-weight="700">Udara luar</text>
  <text x="28" y="578" font-size="32" fill="#1E2019" font-weight="700">Udara di dalam kotak</text>
  <!-- tutup kotak -->
  <rect x="0" y="290" width="350" height="40" fill="url(#arsir)" stroke="#1E2019" stroke-width="3"/>
  <rect x="450" y="290" width="350" height="40" fill="url(#arsir)" stroke="#1E2019" stroke-width="3"/>
  <text x="28" y="276" font-size="26" fill="#1E2019">tutup kotak</text>
  <!-- cakram + beban -->
  <rect x="325" y="268" width="150" height="22" rx="4" fill="#1E2019"/>
  <rect x="355" y="190" width="90" height="78" rx="6" fill="#5A6668" stroke="#1E2019" stroke-width="3"/>
  <text x="400" y="238" font-size="26" fill="#FFFFFF" text-anchor="middle">beban</text>
  <!-- diameter -->
  <line x1="350" y1="362" x2="450" y2="362" stroke="#1E2019" stroke-width="2.5" marker-start="url(#pGelap)" marker-end="url(#pGelap)"/>
  <text x="470" y="372" font-size="28" fill="#1E2019" font-style="italic">d</text>
  <!-- gaya ke atas -->
  <line x1="400" y1="520" x2="400" y2="340" stroke="#0C70A1" stroke-width="8" marker-end="url(#pBiru)"/>
  <text x="380" y="460" font-size="30" fill="#0C70A1" font-weight="700" text-anchor="end">p<tspan font-size="20" dy="6">dalam</tspan><tspan dy="-6"> · A</tspan></text>
  <!-- gaya ke bawah -->
  <line x1="400" y1="80" x2="400" y2="180" stroke="#1E2019" stroke-width="8" marker-end="url(#pGelap)"/>
  <text x="380" y="130" font-size="30" fill="#1E2019" font-weight="700" text-anchor="end">mg</text>
  <line x1="500" y1="120" x2="500" y2="258" stroke="#1E2019" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#pGelap)"/>
  <text x="520" y="190" font-size="30" fill="#1E2019" font-weight="700">p<tspan font-size="20" dy="6">luar</tspan><tspan dy="-6"> · A</tspan></text>
  <!-- syarat -->
  <rect x="470" y="408" width="310" height="120" rx="14" fill="#FFFFFF" stroke="#0C70A1" stroke-width="3"/>
  <text x="625" y="452" font-size="26" fill="#1E2019" text-anchor="middle">Katup terangkat jika</text>
  <text x="625" y="500" font-size="36" fill="#1E2019" text-anchor="middle" font-weight="700">Δp · A = mg</text>
</svg>
